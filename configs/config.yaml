
project:
  name: "IT Student Employability Research"
  data_type: "real_survey"
  random_seed: 42

data:
  input_path: "data/survey/survey_clean.csv"
  output_path: "results/analysis_summary.json"

variables:
  independent:
    - professional_experience
    - academic_projects
    - internship
    - technical_skills
    - communication_skills

  dependent:
    - interview_invitations
    - job_offers

  exposure_denominator:
    - applications_sent

  perception_variables:
    - perceived_difficulty
    - barriers

  potential_confounders:
    - professional_experience
    - academic_projects
    - technical_skills
    - communication_skills

metrics:
  primary: "interview_invitation_rate"
  secondary:
    - "job_offer_rate_per_application"
    - "average_interview_invitations"
  guardrails:
    - "missing_values"
    - "missing_record_rate_percent"
    - "invalid_records"
    - "eligible_sample_size"
    - "data_consistency"

baseline:
  comparison: "internship_yes_vs_no"
  note: "Exploratory observational comparison on a small convenience sample (n = 17); no causal conclusions."

analysis:
  alpha: 0.05

survey:
  raw_path: "data/raw/survey_raw_google_forms.csv"
  clean_path: "data/survey/survey_clean.csv"
  instrument: "Anonymous Google Form (consent required)"
  bootstrap_iterations: 5000
  primary_tests:
    - "difficulty_vs_professional_experience"
    - "interview_rate_internship_vs_none"
    - "interview_rate_vs_technical_skills"
  multiple_comparison_correction: "holm"
