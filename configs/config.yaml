
project:
  name: "IT Student Employability Research"
  data_type: "synthetic_demo"
  random_seed: 42

data:
  input_path: "data/sample/sample.csv"
  output_path: "results/analysis_summary.json"

variables:
  independent:
    - professional_experience
    - academic_projects
    - internship
    - technical_skills
    - communication_skills

  dependent:
    - interview_invitations
    - job_offers

  exposure_denominator:
    - applications_sent

  potential_confounders:
    - professional_experience
    - academic_projects
    - technical_skills
    - communication_skills

metrics:
  primary: "interview_invitation_rate"
  secondary:
    - "job_offer_rate_per_application"
    - "average_interview_invitations"
  guardrails:
    - "missing_values"
    - "missing_record_rate_percent"
    - "invalid_records"
    - "eligible_sample_size"
    - "data_consistency"

baseline:
  comparison: "internship_yes_vs_no"
  note: "Exploratory comparison using synthetic data only; no causal conclusions."

analysis:
  alpha: 0.05
